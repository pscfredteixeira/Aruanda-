<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#18251f" />
  <meta name="description" content="Aruanda — um metroidvania autoral inspirado nas cosmologias afro-brasileiras. Protótipo jogável." />
  <title>Aruanda — Teste de movimento</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#18251f;color:#f4ebd4}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 10%,#344b3b 0,#18251f 62%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 12px}
    header{width:min(100%,1040px);display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 auto 13px}
    .brand{font-family:Georgia,serif;letter-spacing:.13em;font-size:clamp(22px,4vw,31px);font-weight:700}
    .edition{color:#c5bea7;font-size:12px;text-align:right;line-height:1.5}
    main{width:min(100%,1040px)}
    #game-container{width:100%;aspect-ratio:16/9;background:#c9d4be;border:1px solid #63745f;border-radius:12px;overflow:hidden;box-shadow:0 18px 70px #0008;position:relative}
    #game-container canvas{display:block}
    #status{padding:18px;text-align:center;color:#3b5043}
    footer{width:min(100%,1040px);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:13px;color:#b4bda9;font-size:12px}
    footer strong{color:#e6dfc8;font-weight:600}
    a{color:#e8d4a1}
    @media(max-width:620px){body{padding:12px 6px}header{padding:0 8px}footer{padding:0 8px}#game-container{border-radius:7px}}
  </style>
</head>
<body>
  <header><div class="brand">ARUANDA</div><div class="edition">PRÉVIA JOGÁVEL<br>SPRINTS 00 + 02</div></header>
  <main><div id="game-container"><div id="status" role="status">Preparando o mundo de Aruanda…</div></div></main>
  <footer><div><strong>Movimento:</strong> A / D ou ← → &nbsp; <strong>Pulo:</strong> Espaço / W / ↑ ou A do controle</div><div><strong>J / X-□:</strong> atacar &nbsp; <strong>R:</strong> reiniciar &nbsp; <strong>F3:</strong> debug &nbsp; <strong>Esc:</strong> menu</div></footer>
  <script>
    (function(){
      var urls=[
        "https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js",
        "https://unpkg.com/phaser@3.90.0/dist/phaser.min.js"
      ];
      function load(i){
        if(i>=urls.length){
          document.getElementById("status").textContent="Não foi possível carregar a biblioteca do jogo. Verifique sua conexão e tente atualizar a página.";return;
        }
        var script=document.createElement("script");script.src=urls[i];
        script.onload=function(){var game=document.createElement("script");game.src="./combat.js?v=2";game.onload=function(){var play=document.createElement("script");play.src="./game.js?v=2";play.onerror=function(){document.getElementById("status").textContent="Falha ao carregar a lógica do jogo.";};document.body.appendChild(play)};game.src="./combat.js?v=2";game.onerror=function(){document.getElementById("status").textContent="Falha ao carregar o jogo.";};document.body.appendChild(game)};
        script.onerror=function(){load(i+1)};
        document.body.appendChild(script);
      }
      load(0);
    })();
  </script>
</body>
</html>
